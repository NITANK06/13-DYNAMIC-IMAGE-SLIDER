<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dynamic Image Slider</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="carousel-container">

    <!-- Slider -->

    <div class="carousel" id="carousel">

      <div class="slide active">
        <img
          src="https://picsum.photos/id/1015/1000/500"
          alt="Slide 1"
        >
      </div>

      <div class="slide">
        <img
          src="https://picsum.photos/id/1016/1000/500"
          alt="Slide 2"
        >
      </div>

      <div class="slide">
        <img
          src="https://picsum.photos/id/1018/1000/500"
          alt="Slide 3"
        >
      </div>

      <div class="slide">
        <img
          src="https://picsum.photos/id/1020/1000/500"
          alt="Slide 4"
        >
      </div>

    </div>

    <!-- Navigation Buttons -->

    <button class="prev" id="prevBtn">
      ❮
    </button>

    <button class="next" id="nextBtn">
      ❯
    </button>

    <!-- Dots -->

    <div class="dots" id="dotsContainer"></div>

  </div>

  <script src="script.js"></script>

</body>
</html>
